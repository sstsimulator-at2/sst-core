---
name: Build/test on Arch Linux

on:
  workflow_call:

concurrency:
  group: free-arch-${{github.workflow}}-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:
  arch:
    name: Build/test core ref and elements devel
    runs-on: ubuntu-26.04
    container:
      image: archlinux:base-devel-20260621.0.546891@sha256:cf028aee853281ba9b3cba41b49f7ad4836275256226938ab619e0f05b1e6105
      # Docker's default 64 MiB /dev/shm is too small for the OpenMPI 5
      # shared-memory segment, which then warns on stderr.
      options: --shm-size=1g
    steps:

      - name: Install git
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm git

      - name: Clone core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sst-core
          persist-credentials: false

      - name: Clone elements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sst-elements
          persist-credentials: false
          ref: devel
          repository: sstsimulator-at2/sst-elements

      - name: Install system-level dependencies
        run: |
          sst-core/.github/scripts/install_os_level_dependencies.sh

      - name: Install ccache
        run: |
          pacman -S --noconfirm ccache

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          create-symlink: true
          key: >-
            free-arch
          max-size: "1.5GB"
          verbose: 2

      - name: Create unprivileged build user
        run: |
          sst-core/.github/scripts/run_as_ci_user.sh --setup

      - name: Set environment variables
        run: |
          MAKEFLAGS="-j$(nproc)"
          echo "MAKEFLAGS=${MAKEFLAGS}" >> "${GITHUB_ENV}"
          echo "TERM=dumb" >> "${GITHUB_ENV}"

      - name: Compile core
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          # TODO the argument does nothing as long as Spack is unavailable
          sst-core/.github/scripts/core_autotools_noflags_nodeps.sh gcc

      - name: Test core
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          install_autotools_noflags_nodeps_gcc/bin/sst-test-core

      - name: Save sst_test_outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sst_test_outputs_core_free-arch
          path: sst_test_outputs
          compression-level: 9
          if-no-files-found: error
          retention-days: 5
        if: ${{ !cancelled() }}

      - name: Compile elements
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          # TODO the argument does nothing as long as Spack is unavailable
          sst-core/.github/scripts/elements_autotools_noflags_nodeps.sh gcc

      - name: Test elements
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          install_autotools_noflags_nodeps_gcc/bin/sst-test-elements

      - name: Save sst_test_outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sst_test_outputs_elements_free-arch
          path: sst_test_outputs
          compression-level: 9
          if-no-files-found: error
          retention-days: 5
        if: ${{ !cancelled() }}
