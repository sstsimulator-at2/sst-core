  #     artifact-name: at2-rocky8
  at2-rocky8-nompi:
    if: ${{ (github.event.action == 'synchronize' || github.event.action == 'opened') || github.event.action == 'labeled' }}
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: '["self-hosted", "sst-rocky8"]'
      # The runner image has the dependencies.
      install-deps: false
      mpi: false
      # TODO: remove when the AT2 images have the third-party dependencies.
      deps: none
      ccache-key: at2-rocky8-nompi-gcc
      ccache-save: true
      artifact-name: at2-rocky8-nompi
