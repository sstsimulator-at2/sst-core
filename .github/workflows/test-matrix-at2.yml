---
name: sst-core build/install/test on self-hosted runners

# yamllint disable-line rule:truthy
on:
  workflow_call:

permissions: {}

# TODO: add a nightly job with CUDA and GPGPU-Sim, on an AT2 image that has
# the CUDA toolkit.  build-options.bash passes --with-cuda and
# --with-gpgpusim when CUDA_INSTALL_PATH and GPGPUSIM_ROOT are set.

# Cancels any in progress 'workflow' associated with this PR
concurrency:
  group: test-matrix-at2-${{github.workflow}}-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

