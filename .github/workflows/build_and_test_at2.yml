  #   uses:
  #     $/.github/workflows/build-test.yml
  #   permissions:
  #     packages: write # to save ccache
  #   with:
  #     runs-on: '["self-hosted", "sst-rocky8"]'
  #     # The runner image has the dependencies.
  #     install-deps: false
  #     ccache-key: at2-rocky8-mpi-gcc
  #     ccache-save: true
  #     artifact-name: at2-rocky8
  at2-rocky8-nompi:
    needs: pre-checks
    if: ${{ needs.pre-checks.outputs.should_skip != 'true' && (github.event.action == 'synchronize' || github.event.action == 'opened') || github.event.action == 'labeled' }}
    uses:
      $/.github/workflows/build-test.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: '["self-hosted", "sst-rocky8"]'
      # The runner image has the dependencies.
      install-deps: false
      mpi: false
      ccache-key: at2-rocky8-nompi-gcc
      ccache-save: true
      artifact-name: at2-rocky8-nompi
